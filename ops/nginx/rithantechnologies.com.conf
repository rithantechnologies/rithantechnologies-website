# These declarations live in Nginx's http context (sites-enabled is included there).
# One short-lived, host-specific security access log; no query strings are recorded.
map $http_referer $rithan_referrer_source {
    default "other";
    "" "none";
    ~*^https?://(www\.)?google\.[^/]+ "google";
    ~*^https?://l\.instagram\.com(/|$) "instagram";
    ~*^https?://(www\.)?facebook\.com(/|$) "facebook";
    ~*^https?://chatgpt\.com(/|$) "chatgpt";
    ~*^https?://(www\.)?rithantechnologies\.com(/|$) "internal";
    ~*^https?://spstrack\.rithantechnologies\.com(/|$) "sps-track";
}
log_format rithan_access_json_v1 escape=json
    '{"time":"$time_iso8601","host":"$host","ip":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"referrer_source":"$rithan_referrer_source","ua":"$http_user_agent"}';

# Independent aggregate events log: no IP, device, cookies, referrer or query.
log_format rithan_event_json_v1 escape=json
    '{"time":"$time_iso8601","host":"$host","event":"$uri","status":$status}';

# Rithan Technologies static site, VPS srv2078618 (187.126.126.42).
# Certbot renews via the HTTP-01 webroot independently of the old VPS.
server {
    listen 80;
    listen [::]:80;
    server_name rithantechnologies.com www.rithantechnologies.com;

    # Scoped only to this virtual host; no other VPS projects are affected.
    access_log /var/log/nginx/rithantechnologies-access.log rithan_access_json_v1;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rithan-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rithantechnologies.com www.rithantechnologies.com;

    # Scoped only to this virtual host; no other VPS projects are affected.
    access_log /var/log/nginx/rithantechnologies-access.log rithan_access_json_v1;

    ssl_certificate /etc/letsencrypt/live/rithantechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rithantechnologies.com/privkey.pem;

    root /srv/rithantechnologies-website/site;
    index index.html;

    # Keep the existing main-domain WhatsApp verification endpoint.
    location = /webhooks/whatsapp {
        limit_except GET POST { deny all; }
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rithan-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # Anonymous, fixed-category page views / contact clicks (POST only).
    # This endpoint is deliberately kept independent of the public-site 403 block.
    # Events are aggregate signals, not proof of a unique visitor or identity.
    location ^~ /__rt_events/ {
        if ($request_method != POST) { return 405; }
        if ($http_origin !~* "^https://(www\.)?rithantechnologies\.com$") { return 403; }
        if ($uri !~ "^/__rt_events/(page/(home|whatsapp-ai|privacy|terms|ai-privacy|ai-deletion)|contact/(home|whatsapp-ai|privacy|terms|ai-privacy|ai-deletion)/(phone|email|whatsapp))$") { return 404; }
        client_max_body_size 1k;
        access_log /var/log/nginx/rithantechnologies-events.log rithan_event_json_v1;
        add_header Cache-Control "no-store" always;
        return 204;
    }

    # Website temporarily blocked from public access.
    # Preserve WhatsApp webhook and SSL renewal routes.
    location ^~ / {
        return 403;
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
