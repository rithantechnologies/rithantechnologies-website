# Rithan Technologies static site, VPS srv2078618 (187.126.126.42).
# Certbot renews via the HTTP-01 webroot independently of the old VPS.
server {
    listen 80;
    listen [::]:80;
    server_name rithantechnologies.com www.rithantechnologies.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rithan-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rithantechnologies.com www.rithantechnologies.com;

    ssl_certificate /etc/letsencrypt/live/rithantechnologies.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rithantechnologies.com/privkey.pem;

    root /srv/rithantechnologies-website/site;
    index index.html;

    # Keep the existing main-domain WhatsApp verification endpoint.
    location = /webhooks/whatsapp {
        limit_except GET POST { deny all; }
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rithan-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.(png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
